server:
	interface: 0.0.0.0
	access-control: 0.0.0.0/0 allow
	do-daemonize: no
	username: ""
	chroot: ""
	directory: "/etc/unbound"
	pidfile: ""
	use-syslog: no
	log-time-ascii: yes
	# servselect / rtt / timeout decisions are logged at verbosity 4
	verbosity: 4
	module-config: "iterator"
	prefetch: no
	# shorter than the 900s default so recovery of a dead upstream is
	# observable within the test run; the mechanism is the same
	infra-host-ttl: 30

remote-control:
	control-enable: yes
	control-interface: 0.0.0.0
	control-use-cert: no
